[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-file-organizer"
version = "0.1.0"
description = "A command-line tool and agent skill for organizing local files: scan, classify, rename, and move files by type, name, or content, with plan preview and undo."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "赵旭东", email = "violet-041125@users.noreply.github.com" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
# 核心能力仅用标准库（pathlib/mimetypes/argparse），无第三方运行时依赖；
# 可选能力（内容抽取 / 目录监听 / 规则加载）通过 optional-dependencies 按需安装。
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
content = ["pypdf>=4", "python-docx>=1"]  # PDF/DOCX 内容抽取
watch = ["watchdog>=6"]                   # 目录监听
config = ["pyyaml>=6"]                    # YAML 规则加载

[project.scripts]
file_organizer = "file_organizer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
